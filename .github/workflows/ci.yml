
name: MCP Assistant CI/CD

'on':
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  code-quality:
    name: Lint and syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check server.py agent.py

      - name: Check Python syntax
        run: python -m compileall -q server.py agent.py

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::509399610903:role/GitHubActionsDeployRole
          aws-region: us-east-1

      - name: Send deployment command to EC2
        id: deploy
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-027b1443307a7b20f \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy GitHub Repository Assistant" \
            --parameters '{"commands":["set -e","cd /home/ec2-user/git-repo-assistant","git config --global --add safe.directory /home/ec2-user/git-repo-assistant","git fetch origin master","git reset --hard origin/master","source .venv/bin/activate","python -m pip install -r requirements.txt"]}' \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      
      - name: Wait for deployment and show error
        if: always()
        shell: bash
        run: |
          aws ssm get-command-invocation \
            --region us-east-1 \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id i-027b1443307a7b20f \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

